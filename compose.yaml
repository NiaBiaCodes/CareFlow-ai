name: careflow_starter

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.3.10
    user: "0"
    command: ["start", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:?Set SURREAL_PASSWORD in .env}", "rocksdb:/data/careflow.db"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - careflow-surreal:/data
    restart: unless-stopped

volumes:
  careflow-surreal:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-local"
version = "0.1.0"
description = "Synthetic hospital chart comparison and fictional prior authorization drafts"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3", "uvicorn==0.54.0", "jinja2==3.1.6",
  "pydantic==2.14.1", "python-dotenv==1.2.4",
  "httpx==0.28.1", "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]
integrations = ["daytona==0.224.1", "anchorbrowser==1.0.1", "openai==3.31.0",
                "playwright==1.64.0", "arize-phoenix-otel==0.17.2"]

[tool.setuptools]
py-modules = ["core"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real local SurrealDB instance"]
